<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inbox</title>
    <!-- The panel CSP allows script from this plugin's own files only (no inline script), so the
      logic lives in main.js; rowlogic.js holds its pure parts. The SDK gives the page `ccPanel`, the
      app theme variables and the component stylesheet (`ccc guide style`: .cc-toolbar, .cc-chip,
      .cc-group, .cc-row, .cc-badge, .cc-error-line, .cc-empty). The rules below only place those
      components for this panel (unlayered, so they win over the layer) and draw what has no
      component: the source dot, the row's action strip over its right end, the snooze menu, the undo
      toast. Colours only from the theme tokens; a source colour is a palette name used as a class. -->
    <script src="/__sdk/panel.js"></script>
    <script src="rowlogic.js" defer></script>
    <script src="main.js" defer></script>
    <style>
      body { margin: 0; }
      /* Unlayered, so it beats the layer's `display: flex` on the toolbar. */
      [hidden] { display: none; }

      .cc-toolbar { position: sticky; top: 0; z-index: 3; background: var(--cc-bg); }
      .chips { display: flex; flex-wrap: wrap; gap: var(--cc-space-1); }
      .cc-chip .cc-count { font-weight: 400; }
      .cc-chip .problem { color: var(--cc-status-ended); font-weight: 600; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cc-project-grey); }
      .dot.green { background: var(--cc-project-green); } .dot.red { background: var(--cc-project-red); }
      .dot.blue { background: var(--cc-project-blue); } .dot.amber { background: var(--cc-project-orange); }
      .dot.violet { background: var(--cc-project-purple); } .dot.grey { background: var(--cc-project-grey); }

      #notice, #lines { display: flex; flex-direction: column; gap: var(--cc-space-1); padding: 0 var(--cc-space-2); }
      #notice:not(:empty) { padding-top: var(--cc-space-2); }
      #lines:not(:empty) { padding-top: var(--cc-space-2); }
      .cc-error-line { overflow-wrap: anywhere; }
      #body { padding: var(--cc-space-2) var(--cc-space-1); }
      .search-h, .more { padding: var(--cc-space-1) var(--cc-space-3); font-size: var(--cc-text-s); }

      /* A row: the badge on the first line, the text in lines below each other. */
      .inbox-row { align-items: flex-start; padding-block: 6px; cursor: pointer; }
      .inbox-row > .cc-badge { flex: none; min-width: 40px; justify-content: center; margin-top: 1px; font-weight: 600; letter-spacing: .03em; }
      .inbox-row .cc-row-meta .mark { color: var(--cc-accent); }
      .inbox-row .cc-row-meta .mark::before, .inbox-row .cc-row-meta .reason::before { content: ' · '; color: var(--cc-fg-muted); }
      .inbox-row .cc-row-meta .reason { color: var(--cc-fg-subtle); }
      .inbox-row .preview { overflow: hidden; font-size: var(--cc-text-s); text-overflow: ellipsis; white-space: nowrap; }
      .inbox-row .labels { display: flex; flex-wrap: wrap; gap: var(--cc-space-1); margin-top: 2px; }
      .inbox-row .labels .cc-chip { height: 18px; cursor: default; }
      /* The actions over the row's right end (they would take the title's room in the flow), on the
         component's own hover and focus rule (visibility). */
      .inbox-row > .cc-row-actions { position: absolute; top: 4px; right: var(--cc-space-2); padding: 2px; border-radius: var(--cc-radius-m); background: var(--cc-surface-2); box-shadow: 0 1px 4px var(--cc-shadow); }
      .inbox-row > .cc-row-actions button { height: 22px; padding: 0 var(--cc-space-2); font-size: var(--cc-text-s); }

      .menu { position: absolute; right: var(--cc-space-2); top: calc(100% - 2px); z-index: 5; display: flex; flex-direction: column; min-width: 200px; padding: var(--cc-space-1); border: 1px solid var(--cc-border); border-radius: var(--cc-radius-m); background: var(--cc-bg-menu); box-shadow: 0 8px 24px var(--cc-shadow); }
      .menu .menu-h { padding: 2px var(--cc-space-2); font-size: var(--cc-text-s); }
      .menu button { justify-content: space-between; width: 100%; color: var(--cc-fg); }

      #toast { position: sticky; bottom: 0; padding: 0 var(--cc-space-2) var(--cc-space-2); }
      #toast:empty { display: none; }
      .toast { display: flex; align-items: center; gap: var(--cc-space-3); padding: var(--cc-space-1) var(--cc-space-1) var(--cc-space-1) var(--cc-space-3); border: 1px solid var(--cc-border); border-radius: var(--cc-radius-m); background: var(--cc-bg-menu); box-shadow: 0 4px 12px var(--cc-shadow); }
      .toast .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="cc-toolbar" id="toolbar"></div>
    <div id="notice"></div>
    <div id="lines"></div>
    <div id="body"></div>
    <div id="toast"></div>
  </body>
</html>
